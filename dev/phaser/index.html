  <style>html,body{background:#0d1220;height:100%;margin:0;overflow:hidden}#game{width:100%;height:100%}#menu{color:#fff;background:#0a0e1cd1;flex-direction:column;justify-content:center;align-items:center;gap:10px;font-family:Fredoka,system-ui;display:flex;position:fixed;inset:0}#menu.hidden{display:none}.logo{color:#ffd34d;-webkit-text-stroke:3px #6a3a00;text-shadow:0 5px #6a3a00;font-size:76px;font-weight:700}.sub{color:#c7d3f0;margin-bottom:14px;font-size:20px}.tag{background:#2b3a6a;border-radius:2px;padding:2px 8px;font-size:14px}.lab{color:#9fb6dd;margin-top:8px;font-size:16px}.pick{gap:10px;display:flex}.pick button,#play{color:#cfe0ff;cursor:pointer;background:#1b2550;border:3px solid #2b3a6a;border-radius:2px;padding:10px 26px;font:700 22px Fredoka,system-ui}.pick button.on{color:#5a2e00;background:linear-gradient(#ffe680,#ffc928);border-color:#6a3a00}#play{color:#5a2e00;background:linear-gradient(#fff3a0,#ffc928);border-color:#6a3a00;margin-top:18px;padding:14px 60px;font-size:30px;box-shadow:0 6px #6a3a00}.hint{color:#9fb6dd;margin-top:12px;font-size:15px}#menu .row{align-items:center;gap:10px;margin:6px 0;display:flex}#menu input{color:#5a2e00;background:#fff4dc;border:3px solid #6b3f1d;border-radius:2px;outline:none;padding:10px 12px;font:600 20px Fredoka,system-ui}#menu select{color:#5a2e00;background:#fff4dc;border:3px solid #6b3f1d;border-radius:2px;padding:9px 8px;font:600 20px Fredoka,system-ui}#menu input.code{text-transform:uppercase;letter-spacing:3px;text-align:center;width:120px}#menu .cols{gap:30px;margin-top:18px;display:flex}#menu .col{color:#5a2e00;background:#fff4dcf2;border:4px solid #6b3f1d;flex-direction:column;align-items:flex-start;min-width:380px;padding:18px 22px;display:flex}#menu .col .h{margin-bottom:6px;font-size:26px;font-weight:700}#menu .col .lab{color:#9a6a3a;margin-top:6px}#menu .col button,#hostBtn,#joinBtn{color:#5a2e00;cursor:pointer;background:linear-gradient(#ffe680,#ffc928);border:3px solid #6b3f1d;border-radius:2px der:2px solid #6b3f1d;flex-shrink:0;align-self:flex-start;max-width:100%;padding:.12em .5em;font-weight:500;transition:opacity .6s}#chat .line b{color:#b0451b;font-weight:700}#chat .line.mine b{color:#2f7d34}#chat .line.old{opacity:0}#chat input{box-sizing:border-box;color:#5a2e00;pointer-events:auto;background:#fff4dc;border:3px solid #6b3f1d;outline:none;width:100%;padding:.3em .5em;font:600 1em Fredoka,system-ui;display:none}#chat.active input{display:block}#chat.active .line{background:#fff4dcf7}#chat .line.sys{color:#8a6a3a;background:#ffecc8d9;font-style:italic}#chat.lobby{box-sizing:border-box;background:#fff4dcf2;border:3px solid #6b3f1d;padding:.45em .6em .5em}#chat.lobby .log{box-sizing:border-box;pointer-events:auto;justify-content:flex-start;padding:.15em 0;overflow:hidden auto;-webkit-mask-image:linear-gradient(#0000 0,#000 .9em);mask-image:linear-gradient(#0000 0,#000 .9em)}#chat.lobby .line{background:0 0;border:none;padding:.05em .2em}</style>

<body>
  <div id="game"></div>
  <div id="menu" class="hidden">
    <div class="logo">KEKBOUND</div>
    <div class="row"><span class="lab">Your name</span><input id="pname" maxlength="16" placeholder="Name"></div>
    <div class="cols">

        <div class="row"><input id="jcode" maxlength="5" placeholder="CODE" class="code"><button id="joinBtn">Join</button></div>
        <div id="mmsg" class="msg"></div>
      </div>
      <div class="col">
        <div class="h">Practice vs AI</div>
        <div class="lab">Your bot</div><div class="pick" id="pick0"></div>
        <div class="lab">Opponent</div><div class="pick" id="pick1"></div>
        <button id="play">Practice</button>
      </div>
    </div>
  </div>
